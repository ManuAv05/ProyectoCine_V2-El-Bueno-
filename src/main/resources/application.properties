spring.application.name=Cine_V2
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/cine_db
spring.datasource.username=cine_user
spring.datasource.password=cine_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 1. El secreto se inyecta desde una Variable de Entorno
# Nunca escribas la clave real aquí
jwt.secret=${JWT_SECRET:MiClaveSecretaSuperSeguraParaJWT2024CineV2Application}

# 2. Tiempo de expiración (1 hora)
jwt.expiration=3600000
logging.level.org.springframework.security=TRACE
